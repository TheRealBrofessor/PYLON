services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: pylon-elasticsearch
    restart: unless-stopped

    environment:
      - node.name=pylon-es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}

    ports:
      - "${ES_PORT}:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 12g

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: pylon-kibana
    restart: unless-stopped

    depends_on:
      elasticsearch:
        condition: service_healthy

    environment:
      - SERVER_NAME=pylon-kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_KEY}

    ports:
      - "${KB_PORT}:5601"

    networks:
      - backend
      - frontend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  elasticsearch-data:
    name: pylon-cyberrange-elasticsearch-data

networks:
  backend:
    name: pylon-cyberrange-backend
    internal: true

  frontend:
    name: pylon-cyberrange-frontend
